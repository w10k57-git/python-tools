[project]
name = "engcalc-cli"
version = "0.1.0"
description = "Command-line tool for engineering calculations"
readme = "README.md"
requires-python = ">=3.11, <3.14"

dependencies = [
    "click>=8.3.1",
    "rich>=14.2.0",
]

[project.scripts]
engcalc = "engcalc_cli.main:cli"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

